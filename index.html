    <!-- SoftwareApplication Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SnapFind AI",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web, Android, iOS",
      "description": "Search, organize and protect your screenshots with SnapFind AI.",
      "url": "https://snapfind.ai.studio/",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free plan includes 100 screenshots indexed locally with natural language search."
      },
      "featureList": [
        "AI Screenshot Search",
        "Gemini Vision OCR and indexation",
        "Private offline-capable storage",
        "Smart automatic categorization",
        "Encrypted Vault and private collections"
      ]
    }

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body style="margin: 0; background: linear-gradient(135deg, #18211E 0%, #0A3638 100%) fixed; color: #F1F5F9; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="root">
      <!-- Safe Pre-React Brand Splash Loader (replaces blank white screen on startup) -->
      <div id="sf-startup-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(160deg, #062122 0%, #0A383A 50%, #041617 100%); padding: 24px; box-sizing: border-box; text-align: center;">
        <div style="position: relative; margin-bottom: 24px;">
          <div style="width: 72px; height: 72px; border-radius: 20px; background: #16202C; border: 1px solid #273548; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(6,33,34,0.8);">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#116466" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
              <circle cx="12" cy="13" r="3"></circle>
            </svg>
          </div>
          <div style="position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%; background-color: #D1E8E2; border: 2px solid #141B19;"></div>
        </div>
        <h1 style="margin: 0 0 8px 0; font-size: 20px; font-weight: 800; letter-spacing: 0.05em; color: #F1F5F9;">SNAPFIND AI</h1>
        <p style="margin: 0 0 24px 0; font-size: 12px; color: #94A3B8; letter-spacing: 0.02em;">Loading visual memory engine...</p>
        <div style="width: 140px; height: 3px; background-color: #273548; border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: linear-gradient(90deg, #116466, #157F81); border-radius: 9999px; animation: sf-indeterminate 1.5s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes sf-indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>

    <!-- Diagnostic and Safe Startup Error Screen Handler -->
    <script>
      (function() {
        var hasMounted = false;
        window.__SNAPFIND_MOUNTED__ = function() {
          hasMounted = true;
        };

        function showStartupError(msg) {
          if (hasMounted) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = [
            '<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #062122 0%, #0A383A 50%, #041617 100%); color: #F1F5F9; padding: 20px; font-family: system-ui, -apple-system, sans-serif; box-sizing: border-box;">',
            '  <div style="max-width: 420px; width: 100%; background-color: #16202C; border: 1px solid #273548; border-radius: 20px; padding: 24px; text-align: center; box-shadow: 0 20px 40px rgba(6,33,34,0.8);">',
            '    <div style="width: 48px; height: 48px; border-radius: 14px; background: rgba(217, 176, 140, 0.15); color: #D9B08C; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 24px;">⚠</div>',
            '    <h2 style="margin: 0 0 8px 0; font-size: 18px; font-weight: 700; color: #F1F5F9;">Initialization Notice</h2>',
            '    <p style="margin: 0 0 16px 0; font-size: 13px; color: #94A3B8; line-height: 1.5;">SnapFind encountered a temporary startup issue. You can restart or reset local cache to continue.</p>',
            '    <div style="background-color: #141B19; border: 1px solid #273548; border-radius: 10px; padding: 10px; margin-bottom: 20px; text-align: left; font-family: monospace; font-size: 11px; color: #D9B08C; max-height: 80px; overflow-y: auto; word-break: break-all;">',
            msg || 'Unknown startup error',
            '    </div>',
            '    <div style="display: flex; gap: 10px; justify-content: center;">',
            '      <button onclick="window.location.reload()" style="flex: 1; padding: 12px 16px; border-radius: 12px; background: #116466; color: #F1F5F9; font-weight: 700; font-size: 13px; border: none; cursor: pointer;">Reload App</button>',
            '      <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="flex: 1; padding: 12px 16px; border-radius: 12px; background: #1E293B; color: #94A3B8; font-weight: 600; font-size: 13px; border: 1px solid #334155; cursor: pointer;">Reset Cache</button>',
            '    </div>',
            '  </div>',
            '</div>'
          ].join('');
        }

        window.addEventListener('error', function(e) {
          if (!hasMounted) {
            console.warn('[StartupLoadWarning]', e.message || e);
          }
        });

        window.addEventListener('unhandledrejection', function(e) {
          // Non-blocking warning for unhandled rejections to prevent crashing startup UI
          if (e && e.reason) {
            console.warn('[UnhandledRejectionWarning]', e.reason.message || e.reason);
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
