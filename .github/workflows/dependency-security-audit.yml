name: Dependency Security Audit

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

# Auditing dependencies must never grant this workflow permission to push changes to main.
permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Generate dependency vulnerability report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const meta = report.metadata?.vulnerabilities || {};
          console.log('VULNERABILITY SUMMARY:', JSON.stringify(meta));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via.map(v => typeof v === 'string' ? v : {
                name: v.name, title: v.title, url: v.url, range: v.range
              })
            }));
          }
          if ((meta.critical || 0) > 0 || (meta.high || 0) > 0) {
            console.error('High or critical dependency vulnerabilities require a reviewed remediation.');
            process.exitCode = 1;
          }
          NODE

      - name: Upload machine-readable audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapfind-npm-audit
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
