name: SnapFind Audit CI

on:
  push:
    branches:
      - "audit/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: snapfind-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run automated tests
        run: npm test -- --reporter=dot

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
