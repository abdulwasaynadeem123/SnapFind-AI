name: SnapFind Audit CI

on:
  push:
    branches:
      - "audit/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: snapfind-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint

  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Security and indexing performance regressions
        run: npm test -- tests/security-api.test.ts tests/indexing-search-stress.test.ts tests/founder-promo-rpc.test.ts --reporter=dot

  full-test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run full test suite
        run: npm test -- --reporter=dot

  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check high and critical vulnerabilities
        run: npm audit --audit-level=high
