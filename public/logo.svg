  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#30362E" stroke-width="2"/>

  <!-- Magnifying Glass Handle in solid #30362E with #B7F36B tip -->
  <line x1="58" y1="58" x2="78" y2="78" stroke="#1B1F1A" stroke-width="9" stroke-linecap="round"/>
  <line x1="58" y1="58" x2="78" y2="78" stroke="#30362E" stroke-width="5" stroke-linecap="round"/>
  <circle cx="78" cy="78" r="3.5" fill="#B7F36B"/>

  <!-- Magnifying Glass Lens Rim in solid #B7F36B -->
  <circle cx="46" cy="44" r="22" stroke="#B7F36B" stroke-width="4.5" fill="#141714"/>

  <!-- Viewfinder Frame inside Lens (Screenshot target) -->
  <rect x="36" y="34" width="20" height="20" rx="4" fill="#1B1F1A" stroke="#30362E" stroke-width="1.5"/>

  <!-- Viewfinder Corner Marks in #B7F36B -->
  <path d="M 33 38 L 33 32 L 39 32" stroke="#B7F36B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 53 32 L 59 32 L 59 38" stroke="#B7F36B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 33 50 L 33 56 L 39 56" stroke="#B7F36B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 53 56 L 59 56 L 59 50" stroke="#B7F36B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clean Mountain / Media Glyph in #F7F8F5 -->
  <circle cx="41.5" cy="40.5" r="1.5" fill="#F7F8F5"/>
  <path d="M 38 50 L 43 43 L 47 47 L 50 42 L 54 50 Z" fill="#F7F8F5"/>
</svg>
