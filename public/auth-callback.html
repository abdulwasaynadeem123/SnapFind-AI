<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SnapFind AI - Completing Sign-In</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background-color: #080908;
        color: #f7f8f5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background-color: #141714;
        border: 1px solid #30362e;
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        box-shadow: 4px 4px 18px rgba(0, 0, 0, 0.7);
      }
      .badge {
        width: 44px;
        height: 44px;
        margin: 0 auto 14px auto;
        border-radius: 12px;
        background-color: #1b1f1a;
        border: 1px solid #30362e;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #b7f36b;
        font-weight: 800;
        font-size: 18px;
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 17px;
        font-weight: 700;
      }
      p {
        margin: 0 0 16px 0;
        font-size: 13px;
        line-height: 1.5;
        color: #a5aaa1;
      }
      button {
        display: none;
        width: 100%;
        padding: 10px 14px;
        border-radius: 10px;
        border: none;
        background-color: #b7f36b;
        color: #080908;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      button.visible {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <main class="card" role="status" aria-live="polite">
      <div class="badge" aria-hidden="true">S</div>
      <h1 id="oauth-status-title">Completing Google Sign-In...</h1>
      <p id="oauth-status-message">Securely returning to your SnapFind AI window.</p>
      <button id="oauth-close-btn" type="button">Close Window</button>
    </main>
    <script src="/auth-callback.js"></script>
  </body>
</html>
